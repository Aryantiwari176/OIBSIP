<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RailBook</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(120deg, #123b72, #2877bd);
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px #00000030;
        }

        h1 {
            text-align: center;
            color: #123b72;
        }

        p {
            text-align: center;
            color: #64748b;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            border: none;
            border-radius: 6px;
            background: #f59e0b;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>🚆 RailBook</h1>
        <p>Login to your account</p>

        <form id="loginForm">
            <label for="email">Email Address</label>
            <input id="email" type="email"
                   placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input id="password" type="password"
                   placeholder="Enter your password" required>

            <button type="submit">Login</button>
            <p id="message" role="status"></p>
        </form>

        <p>Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>

        <p><a href="index.html">Back to Home</a></p>
    </div>

    <script>
        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                document.getElementById("message").textContent =
                    "Login page ready. Java backend connection is next.";
            });
    </script>
</body>
</html>
